<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For lily ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Georgia", serif;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
    background-size: 300% 300%;
    animation: backgroundMove 10s infinite alternate;
}

@keyframes backgroundMove {
    from {background-position: left;}
    to {background-position: right;}
}

.container {
    width: 90%;
    max-width: 600px;
    padding: 40px;
    text-align: center;
    color: white;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
    animation: appear 2s;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-size: 45px;
    margin-bottom: 20px;
}

.heart {
    font-size: 50px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% {
        transform: scale(1.2);
    }
}

.message {
    font-size: 22px;
    line-height: 1.7;
    margin-top: 25px;
    min-height: 100px;
}

button {
    margin-top: 30px;
    padding: 15px 35px;
    border: none;
    border-radius: 50px;
    background: white;
    color: #ff4d6d;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    transform: scale(1.1);
}

.hidden {
    display: none;
    margin-top: 25px;
    font-size: 20px;
}

.floating-heart {
    position: absolute;
    bottom: -20px;
    color: white;
    animation: float 8s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>Hi lily</h1>

    <div class="message" id="typing"></div>

    <button onclick="openLetter()">
        Open My Letter 💌
    </button>

    <div class="hidden" id="letter">
        I just wanted to create a small place on the internet
        that belongs only to you.

        <br><br>

        Thank you for being the person who makes my days better,
        for your smile, your kindness, and everything that makes you special.

        <br><br>

        I hope whenever you visit this page,
        you remember how much you mean to me.

        ❤️
    </div>

</div>


<script>

let text = 
"Every time you open this page, I hope you remember that someone loves you and thinks you are amazing ❤️";

let index = 0;

function typing() {
    if(index < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(index);
        index++;
        setTimeout(typing, 45);
    }
}

typing();


function openLetter(){
    document.getElementById("letter").style.display="block";
}


// floating hearts

for(let i=0;i<30;i++){

    let heart=document.createElement("div");

    heart.className="floating-heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(5+Math.random()*8)+"s";
    heart.style.fontSize=(15+Math.random()*30)+"px";

    document.body.appendChild(heart);
}

</script>

</body>
</html>
