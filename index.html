<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Lily ❤️</title>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;

    min-height:100vh;

    background:linear-gradient(135deg,#ffd6e7,#fff0f5);

    font-family:Georgia, serif;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow-y:auto;

    padding:20px;

}



/* Floating hearts */

.heart-bg {

    position:fixed;

    bottom:-40px;

    pointer-events:none;

    animation:float 8s linear infinite;

    opacity:.7;

    z-index:0;

}


@keyframes float {

0% {

    transform:translateY(0) rotate(0deg);

    opacity:0;

}


20% {

    opacity:1;

}


100% {

    transform:translateY(-110vh) rotate(360deg);

    opacity:0;

}

}



/* Intro */

.intro {

    text-align:center;

    animation:fadeIn 2s;

    z-index:2;

}


.intro h1 {

    color:#d63384;

    font-size:60px;

    margin-bottom:10px;

}


.intro p {

    color:#d63384;

    font-size:22px;

}





/* Transitions */


.fade-out {

    animation:fadeOut 1.2s forwards;

}


.fade-in {

    animation:fadeIn 1.5s forwards;

}



@keyframes fadeOut {


from {

opacity:1;

transform:scale(1);

}


to {

opacity:0;

transform:scale(.8);

}

}



@keyframes fadeIn {


from {

opacity:0;

transform:translateY(50px) scale(.95);

}


to {

opacity:1;

transform:translateY(0) scale(1);

}

}




/* Envelope */


.container {

    display:none;

    text-align:center;

    z-index:2;

}


.envelope-show {

    animation:envelopeAppear 1.5s ease;

}



@keyframes envelopeAppear {


from {

opacity:0;

transform:translateY(80px) scale(.8);

}


to {

opacity:1;

transform:translateY(0) scale(1);

}

}



.envelope {


    position:relative;


    width:280px;


    height:180px;


    background:#ff8fab;


    margin:auto;


    cursor:pointer;


    border-radius:12px;


    box-shadow:0 10px 25px rgba(0,0,0,.2);


}




.envelope:before {


    content:"";


    position:absolute;


    top:0;


    left:0;


    border-left:140px solid transparent;


    border-right:140px solid transparent;


    border-top:100px solid #ffb3c6;


    transform-origin:top;


    transition:1s;


}



.letter {


    position:absolute;


    background:white;


    width:240px;


    height:150px;


    left:20px;


    top:20px;


    border-radius:10px;


    display:flex;


    justify-content:center;


    align-items:center;


    color:#d63384;


    font-size:30px;


    transition:1s;


}



.open .envelope:before {

    transform:rotateX(180deg);

}



.open .letter {

    transform:translateY(-140px);

}



.text {

    margin-top:35px;

    color:#d63384;

    font-size:22px;

}





/* Message card */


.card {


    display:none;


    background:white;


    width:100%;


    max-width:650px;


    padding:30px 25px;


    border-radius:25px;


    text-align:center;


    box-shadow:0 10px 30px rgba(0,0,0,.2);


    z-index:2;


}



h1 {

    color:#d63384;

    font-size:clamp(28px,8vw,40px);

}




.heart {

    font-size:45px;

    animation:beat 1s infinite;

}



@keyframes beat {


50% {

transform:scale(1.2);

}

}



/* Photo keeps original shape */


.photo {


    width:100%;


    max-width:650px;


    height:auto;


    display:block;


    border-radius:20px;


    border:5px solid #ff8fab;


    margin:20px auto;


}




p {


    color:#555;


    font-size:18px;


    line-height:1.9;


}




h2 {


    color:#d63384;


}




@media(max-width:500px){


.intro h1 {

    font-size:45px;

}


.envelope {

    width:240px;

    height:150px;

}


.envelope:before {

    border-left-width:120px;

    border-right-width:120px;

}


.letter {

    width:200px;

    height:120px;

}


.card {

    padding:25px 18px;

}


p {

    font-size:17px;

}


}
</head>


<body>


<audio id="music">

<source src="amrdiab.mp4" type="audio/mp4">

</audio>




<!-- Lily intro -->

<div class="intro" id="intro">

<h1>
Lily ❤️
</h1>

<p>
I made something special for you...
</p>

</div>





<!-- Envelope -->

<div class="container" id="openScreen">


<div class="envelope" onclick="openEnvelope()">



<div class="letter">

❤️

</div>



</div>



<div class="text">

Open your surprise, Lily ❤️

</div>



</div>






<!-- Letter -->

<div class="card" id="message">


<div class="heart">

❤️

</div>



<h1>
Happy Birthday, Lily ❤️
</h1>



<img src="eyes1.jpeg" class="photo">





<p>
My beautiful Lily,
</p>



<p>
I made this little corner of the internet just for you.
A small place that will always be here whenever you want
to come back and remember how loved you are.
</p>



<p>
No matter when you open this again...
tomorrow, next week, or years from now,
I hope it reminds you of how special you are to me.
</p>




<p>
You are one of the most beautiful people I have ever met.
Your kindness, your smile, and your heart make you
someone truly unforgettable.
</p>




<p>
You are not only my girlfriend.
You are my happiness, my comfort, my peace,
and my favorite person.
</p>




<p>
Thank you for every laugh, every memory,
and every moment that made my life better.
</p>




<p>
I hope this birthday reminds you how loved,
appreciated, and special you truly are.
</p>




<p>
I promise I will always choose you,
support you, and love you.
</p>




<h2>
Happy Birthday, my princess Lily ❤️
</h2>




<p>
Forever yours ❤️
</p>



</div>







<script>


// Show envelope after intro


setTimeout(()=>{


let intro=document.getElementById("intro");

let envelope=document.getElementById("openScreen");



intro.classList.add("fade-out");



setTimeout(()=>{


intro.style.display="none";


envelope.style.display="block";


envelope.classList.add("envelope-show");



},1200);



},2500);







// Floating hearts


function createHeart(){


let heart=document.createElement("div");


heart.className="heart-bg";


heart.innerHTML="❤️";


heart.style.left=Math.random()*100+"vw";


heart.style.fontSize=(15+Math.random()*25)+"px";


heart.style.animationDuration=(5+Math.random()*5)+"s";



document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},10000);



}



setInterval(createHeart,500);









// Open envelope


function openEnvelope(){



document.getElementById("openScreen").classList.add("open");



let music=document.getElementById("music");

music.play();





setTimeout(()=>{


let envelope=document.getElementById("openScreen");

let message=document.getElementById("message");



envelope.classList.add("fade-out");




setTimeout(()=>{


envelope.style.display="none";


message.style.display="block";


message.classList.add("fade-in");


window.scrollTo(0,0);



},1000);




},1200);



}



</script>



</body>

</html>

</style>
